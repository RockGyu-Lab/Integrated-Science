<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>엘니뇨와 라니냐 | 통합과학 World</title>
<style>
:root{--bg:#f3f6fb;--fg:#172334;--muted:#5d6b7d;--card:#fff;--line:#dce4ef;--blue:#1e4f7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#163650,#24618a);color:white;padding:26px 18px}
.wrap{max-width:1000px;margin:0 auto}
.back{display:inline-block;color:#e0edf7;text-decoration:none;margin-bottom:12px}
.back:hover{text-decoration:underline}
h1{font-size:clamp(1.8rem,4vw,2.4rem);margin:0 0 6px}
header p{margin:0;color:#e0edf7}
main{max-width:1000px;margin:0 auto;padding:28px 18px 48px}
.intro{color:var(--muted);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-decoration:none;color:inherit;min-height:190px;box-shadow:0 6px 20px #183b5a0b;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px #183b5a16}
.card:focus-visible{outline:3px solid #4b91cc;outline-offset:3px}
.num{font-size:.85rem;color:var(--blue);font-weight:700;letter-spacing:.04em}
.card h2{font-size:1.18rem;margin:10px 0 6px}
.card p{margin:0;color:var(--muted)}
.open{margin-top:auto;padding-top:18px;color:var(--blue);font-weight:700}
footer{text-align:center;color:var(--muted);font-size:.88rem;padding:0 18px 24px}
@media(max-width:520px){
  header{padding:24px 16px}
  .card{padding:18px;min-height:175px}
}

/* ---- 공통 스타일 (luminosity.html 등 자료 화면과 같은 규칙) ----
   색: 남색 하나를 기본 강조색으로 / 글꼴: Pretendard / 모서리: 카드 14px
   메뉴 카드는 '눌러서 들어가는 문'이라 흰 카드 + 은은한 그림자 + 마우스를 올리면 떠오르는 효과를 유지 */
:root{--bg:#f3f4f8;--fg:#1b1f2a;--muted:#5a6070;--card:#fff;--line:#e3e6ee;--blue:#5468d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--fg:#e8eaf2;--muted:#a3a9bb;--card:#1f222c;--line:#2c3247;--blue:#8f9cf0}}
:root[data-theme="dark"]{--bg:#14161d;--fg:#e8eaf2;--muted:#a3a9bb;--card:#1f222c;--line:#2c3247;--blue:#8f9cf0}
body{font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;word-break:keep-all}
/* 머리 띠: 자료 화면의 그림판과 같은 밤하늘 남색 + 옅은 별 */
header{background:radial-gradient(1px 1px at 12% 30%,#dfe5ffaa,transparent),radial-gradient(1.2px 1.2px at 28% 72%,#dfe5ff77,transparent),radial-gradient(1px 1px at 64% 22%,#dfe5ff99,transparent),radial-gradient(1.3px 1.3px at 82% 64%,#dfe5ff88,transparent),radial-gradient(1px 1px at 92% 18%,#dfe5ff66,transparent),linear-gradient(135deg,#141a36,#2d3a86)}
.card{border-color:transparent;border-radius:14px;box-shadow:0 1px 3px rgba(20,25,45,.06),0 6px 20px rgba(20,25,45,.05)}
.card:hover{border-color:var(--blue);box-shadow:0 2px 6px rgba(20,25,45,.08),0 12px 28px rgba(20,25,45,.09)}
.card:focus-visible{outline-color:var(--blue)}
</style>
<!-- 글꼴(Pretendard): 인터넷이 없으면 시스템 글꼴로 대신 표시되며 기능에는 영향 없음 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>
<header>
  <div class="wrap">
    <a class="back" href="../index.html">← 통합과학 World</a>
    <h1>엘니뇨와 라니냐</h1>
    <p>적도 태평양의 바다와 대기가 평상시, 엘니뇨, 라니냐 때 어떻게 달라지는지 실제 자료와 애니메이션으로 탐구하는 학습실입니다.</p>
  </div>
</header>
<main>
  <p class="intro">자료를 선택해 직접 관찰하고 생각해 보세요.</p>
  <div class="cards">
    <a class="card" href="./elnino.html">
      <span class="num">탐구 01</span>
      <h2>엘니뇨와 라니냐</h2>
      <p>평상시 태평양의 수온 분포와 워커 순환이 만들어지는 까닭을 알아보고, 무역풍의 세기가 달라질 때 일어나는 엘니뇨와 라니냐를 해수면 온도 편차와 대기 순환의 변화로 탐구합니다.</p>
      <span class="open">자료 열기　→</span>
    </a>
  </div>
</main>
<footer>통합과학 World · 엘니뇨와 라니냐</footer>
<script src="../copyright.js"></script>
</body>
</html>
